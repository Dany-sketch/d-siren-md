<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>D SIREN MD | WhatsApp Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <h1>D SIREN MD</h1>
    <p>WhatsApp Automation Dashboard</p>
  </header>

  <main>
    <section id="auth-section">
      <h2>Your Account</h2>

      <form id="register-form">
        <h3>Create Account</h3>
        <input id="register-email" type="email"
          placeholder="Email address" required>
        <input id="register-password" type="password"
          placeholder="Password (8+ characters)" required>
        <button type="submit">Register</button>
      </form>

      <form id="login-form">
        <h3>Login</h3>
        <input id="login-email" type="email"
          placeholder="Email address" required>
        <input id="login-password" type="password"
          placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </section>

    <section id="dashboard" hidden>
      <h2>WhatsApp Connection</h2>
      <p id="account-info"></p>

      <form id="pair-form">
        <input id="phone-number" type="tel"
          placeholder="International number e.g. 2547XXXXXXXX"
          required>
        <button type="submit">Generate Pairing Code</button>
      </form>

      <p id="pair-result" aria-live="polite"></p>
      <p id="connection-status">Disconnected</p>

      <button id="logout-button" type="button">Logout</button>
    </section>

    <p id="message" aria-live="polite"></p>
  </main>

  <footer>
    <p>© 2026 D SIREN MD. All rights reserved.</p>
  </footer>
</body>
</html>
